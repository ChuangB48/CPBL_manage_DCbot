name: CPBL Discord Score Notifier

on:
  schedule:
    # 台灣時間每天 18:00 到 22:00，每 10 分鐘自動執行一次 (UTC 10:00 - 14:00)
    - cron: '*/10 10-14 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊 "Run workflow" 測試

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安裝相依套件
        run: npm install

      - name: 執行推播腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node index.js