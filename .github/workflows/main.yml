name: CPBL Discord Bot Schedule

on:
  schedule:
    # 凌晨 02:00 重置頻道 (UTC 18:00)
    - cron: '0 18 * * *'
    # 備用內建排程：14:00~22:45 每 15 分鐘 (UTC 6-14)
    - cron: '*/15 6-14 * * *'

  # 允許外部 Webhook 精準觸發 (用於解決 GitHub Cron 延遲問題)
  repository_dispatch:
    types: [trigger-bot]

  workflow_dispatch: # 手動點擊按鈕觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 NPM 套件
        run: npm install

      - name: 執行 CPBL Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CATEGORY_ID: ${{ secrets.DISCORD_CATEGORY_ID }}
        run: node index.js