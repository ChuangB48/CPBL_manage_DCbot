name: CPBL Discord Bot Schedule

on:
  schedule:
    # 1. 每日凌晨 02:00 重置頻道 (台灣時間 UTC+8 02:00 = UTC 18:00)
    - cron: '0 18 * * *'
    
    # 2. 每天 14:00 ~ 22:45 每 15 分鐘推送即時戰況 (台灣時間 14:00~22:45 = UTC 06:00~14:45)
    - cron: '*/15 6-14 * * *'

  workflow_dispatch: # 保留 GitHub 頁面手動點擊執行的按鈕

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 NPM 套件
        run: npm install

      - name: 執行 CPBL Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CATEGORY_ID: ${{ secrets.DISCORD_CATEGORY_ID }}
        run: node index.js