name: CPBL Score Auto Scraper

on:
  schedule:
    # 台灣時間 17:00 ~ 23:00，每 15 分鐘執行一次 (對應 UTC 時間 09:00 ~ 15:00)
    - cron: '*/15 9-15 * * *'
  
  # 允許在 GitHub 網頁上手動按按鈕觸發測試
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node index.js